name: chronoquest
description: ChronoQuest - Philippine History Auto-Runner Platformer Game
publish_to: 'none'
# Build number (+N) is ignored for Android — android/app/build.gradle.kts
# overrides versionCode with the git commit count at build time.
version: 1.1.0+2

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.17.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  go_router: ^13.0.0
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  lottie: ^3.1.0
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  flame_audio: ^2.12.2
  flame_tiled: ^3.1.2
  # Pulled in transitively by flame_tiled, but level_loader.dart imports it
  # directly to parse .tmx files, so it is declared explicitly.
  tiled: ^0.11.1
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/backgrounds/
    - assets/characters/
    - assets/enemies/
    - assets/bosses/
    - assets/obstacles/
    - assets/tiles/
    - assets/tiles/levels/
    - assets/collectibles/
    - assets/powerups/
    - assets/ui/
    - assets/sounds/
    - assets/animations/
    - assets/data/