org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Required for the audioplayers_android plugin (pulled in by flame_audio) to
# compile. With incremental compilation on, Kotlin 2.3.20 fails that module's
# :compileDebugKotlin with "Could not close incremental caches ... *.tab" —
# a toolchain bug in the Build Tools API, not a source incompatibility: the
# same sources compile cleanly the moment this is off. This project has no
# Kotlin source of its own (only plugins), so the lost incrementality costs
# essentially nothing here.
kotlin.incremental=false
